<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Carver  Superyacht crew, automated">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05080c"/>
      <stop offset="100%" stop-color="#0a1320"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="88%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <g transform="translate(80,80)" font-family="Geist, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#e2e8f0">
    <g font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="16" fill="#94a3b8" letter-spacing="5">
      <circle cx="6" cy="-6" r="4" fill="#67e8f9"/>
      <text x="22" y="0">CARVER · jobcarver.co</text>
    </g>

    <text x="0" y="130" font-family="Fraunces, Georgia, serif" font-size="104" font-weight="300" fill="#ffffff">
      Superyacht crew,
    </text>
    <text x="0" y="240" font-family="Fraunces, Georgia, serif" font-size="104" font-weight="300" fill="#67e8f9">
      automated.
    </text>

    <text x="0" y="320" font-size="28" fill="#cbd5e1">
      Text <tspan font-family="'Geist Mono', ui-monospace, monospace" fill="#67e8f9">match</tspan> on WhatsApp. Carver scans every live berth
    </text>
    <text x="0" y="360" font-size="28" fill="#cbd5e1">
      against your profile  and applies for you.
    </text>

    <g transform="translate(0,420)" font-family="'Geist Mono', ui-monospace, monospace" font-size="14" fill="#94a3b8" letter-spacing="2">
      <rect x="0" y="0" width="180" height="36" rx="18" fill="none" stroke="#22d3ee" stroke-opacity="0.35"/>
      <text x="20" y="23" fill="#67e8f9">DECK · INTERIOR</text>
      <rect x="200" y="0" width="180" height="36" rx="18" fill="none" stroke="#22d3ee" stroke-opacity="0.35"/>
      <text x="220" y="23" fill="#67e8f9">ENGINE · GALLEY</text>
      <rect x="400" y="0" width="160" height="36" rx="18" fill="none" stroke="#22d3ee" stroke-opacity="0.35"/>
      <text x="420" y="23" fill="#67e8f9">NO APP · NO FORMS</text>
    </g>
  </g>
</svg>
