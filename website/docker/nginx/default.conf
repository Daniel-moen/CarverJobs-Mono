server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${API_URL}; script-src 'self' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' blob: data:; frame-src https://accounts.google.com; object-src 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Plain-text robots.txt (RFC 9309)
  location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # XML sitemap (sitemaps.org)
  location = /sitemap.xml {
    default_type application/xml;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # API catalog (RFC 9727) — must be application/linkset+json
  location = /.well-known/api-catalog {
    default_type application/linkset+json;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Agent Skills discovery index — must be JSON
  location = /.well-known/agent-skills/index.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Homepage — advertise agent-discoverable resources via Link headers (RFC 8288)
  location = / {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${API_URL}; script-src 'self' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' blob: data:; frame-src https://accounts.google.com; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Link "</.well-known/api-catalog>; rel=\"api-catalog\"; type=\"application/linkset+json\", </.well-known/agent-skills/index.json>; rel=\"https://agentskills.io/rel/index\"; type=\"application/json\", </sitemap.xml>; rel=\"sitemap\"; type=\"application/xml\"" always;
    try_files $uri /index.html;
  }

  location /api/ {
    client_max_body_size 10m;
    proxy_pass ${API_URL}/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_cache off;
    # Strip security headers already set by nginx above — prevents duplicate CSP etc.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Cache-Control;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
