# Markdown for Agents (RFC 7231 content negotiation).
# When the request prefers text/markdown AND the URI is a known public page,
# $md_target is set to the pre-rendered markdown file path under /_md/.
# Empty for everything else → HTML stays the default.
map "$http_accept:$uri" $md_target {
  default                                   "";
  "~*text/markdown.*:/$"                    "/_md/index.md";
  "~*text/markdown.*:/privacy/?$"           "/_md/privacy.md";
  "~*text/markdown.*:/terms/?$"             "/_md/terms.md";
  "~*text/markdown.*:/data-deletion/?$"     "/_md/data-deletion.md";
  "~*text/markdown.*:/articles/?$"          "/_md/articles.md";
}

server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${API_URL}; script-src 'self' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' blob: data:; frame-src https://accounts.google.com; object-src 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Plain-text robots.txt (RFC 9309)
  location = /robots.txt {
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # XML sitemap (sitemaps.org). The static file at /sitemap.xml is a
  # sitemap index that references /sitemap-main.xml (static URLs) and
  # /articles/sitemap.xml (article URLs rendered by the API).
  location = /sitemap.xml {
    default_type application/xml;
    add_header Cache-Control "public, max-age=3600" always;
  }
  location = /sitemap-main.xml {
    default_type application/xml;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Dynamic article sitemap — served by the API so it always reflects
  # currently-published articles. Cached briefly so crawlers don't hammer
  # the database.
  location = /articles/sitemap.xml {
    proxy_pass ${API_URL}/articles/sitemap.xml;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Cache-Control;
    default_type application/xml;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Single article pages — server-rendered HTML so crawlers and social
  # previewers receive the article body and meta tags in the initial
  # response (GitHub issue #2). The regex is strict: lowercase letters,
  # digits, and single hyphens only — anything else falls through to the
  # SPA via the catch-all below.
  location ~ ^/articles/([a-z0-9]+(?:-[a-z0-9]+)*)$ {
    proxy_pass ${API_URL}/articles/$1/page.html;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Strip the API's security headers so we can re-apply a tighter CSP
    # that matches what this static HTML actually needs (no scripts).
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Cache-Control;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "public, max-age=300" always;
  }

  # Agent Skills discovery index — must be JSON
  location = /.well-known/agent-skills/index.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
  }

  # Homepage — advertise agent-discoverable resources via Link headers (RFC 8288)
  location = / {
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${API_URL}; script-src 'self' https://accounts.google.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' blob: data:; frame-src https://accounts.google.com; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Link "</.well-known/agent-skills/index.json>; rel=\"https://agentskills.io/rel/index\"; type=\"application/json\", </sitemap.xml>; rel=\"sitemap\"; type=\"application/xml\"" always;
    if ($md_target) { rewrite ^ $md_target last; }
    try_files $uri /index.html;
  }

  # Internal location used by the Accept: text/markdown content-negotiation rewrite.
  # Direct requests to /_md/* are refused (the SPA already renders HTML at / for browsers).
  location /_md/ {
    internal;
    default_type "text/markdown; charset=utf-8";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Vary "Accept" always;
    add_header Cache-Control "public, max-age=300" always;
  }

  location /api/ {
    client_max_body_size 10m;
    proxy_pass ${API_URL}/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_cache off;
    # Strip security headers already set by nginx above — prevents duplicate CSP etc.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Cache-Control;
  }

  location / {
    if ($md_target) { rewrite ^ $md_target last; }
    add_header Vary "Accept" always;
    try_files $uri $uri/ /index.html;
  }
}
