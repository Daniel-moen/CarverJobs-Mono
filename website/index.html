<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>CARVER — Superyacht crew jobs, automated over WhatsApp</title>
    <meta
      name="description"
      content="Carver finds and applies for superyacht crew jobs over WhatsApp. Text 'match' to scan every live berth — deck, interior, engineering, galley — and apply with one reply. No app, no inbox, no signup form."
    />
    <meta
      name="keywords"
      content="superyacht crew jobs, yacht jobs, yacht crew, deckhand jobs, stewardess jobs, chef jobs, engineer jobs, yacht crew agency, whatsapp jobs, carver"
    />
    <meta name="author" content="Carver" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#05080c" />
    <meta name="color-scheme" content="dark" />
    <link id="canonical-link" rel="canonical" href="https://jobcarver.co/" />
    <!-- Per-route SEO before the SPA loads. Googlebot reads the final rendered
         DOM, so this inline script gives every public SPA route its own
         canonical, <title> and description. Without this, every route inherits
         the homepage title/description and Google treats them as duplicates
         ("Crawled - currently not indexed" / "Alternate page with proper
         canonical tag"). App/auth routes get no canonical (they are
         robots-disallowed and not intended for indexing).
         NOTE: /articles and /articles/{slug} are server-rendered by the API
         (see docker/nginx/default.conf), so Googlebot never sees this shell
         for them — they are only listed here so client-side navigation keeps
         a correct canonical. -->
    <script>
      (function () {
        var ORIGIN = 'https://jobcarver.co';
        // Public, indexable routes → their own title + meta description.
        // Keep descriptions under ~160 chars. The homepage ('/') keeps the
        // static tags already in the document.
        var ROUTES = {
          '/privacy': {
            title: 'Privacy Policy — Carver',
            desc: 'How Carver collects, uses, and protects superyacht crew data, plus your data rights and how to contact us.'
          },
          '/terms': {
            title: 'Terms of Service — Carver',
            desc: 'The terms governing your use of Carver — superyacht crew job matching and WhatsApp applications.'
          },
          '/data-deletion': {
            title: 'Data Deletion — Carver',
            desc: 'Request deletion of your Carver account and personal data. Steps and contact details for superyacht crew.'
          },
          '/pricing': {
            title: 'Pricing & Tokens — Carver | Superyacht crew job matching',
            desc: 'Carver pricing and token packs for superyacht crew. Pay only for the matches and applications you use — no subscription.'
          },
          '/refund-policy': {
            title: 'Refund Policy — Carver',
            desc: "Carver's refund policy for token purchases — when refunds apply and how superyacht crew can request one."
          }
        };
        var p = window.location.pathname;
        var el = document.getElementById('canonical-link');
        var isArticle = /^\/articles(\/[a-z0-9]+(?:-[a-z0-9]+)*)?$/.test(p);
        var isPublic = p === '/' || isArticle || ROUTES.hasOwnProperty(p);

        if (el) {
          if (isPublic) el.href = ORIGIN + p;
          else el.parentNode.removeChild(el);
        }

        function setMeta(selector, attr, value) {
          var m = document.querySelector(selector);
          if (m) m.setAttribute(attr, value);
        }

        var r = ROUTES[p];
        if (r) {
          document.title = r.title;
          setMeta('meta[name="description"]', 'content', r.desc);
          setMeta('meta[property="og:title"]', 'content', r.title);
          setMeta('meta[property="og:description"]', 'content', r.desc);
          setMeta('meta[property="og:url"]', 'content', ORIGIN + p);
          setMeta('meta[name="twitter:title"]', 'content', r.title);
          setMeta('meta[name="twitter:description"]', 'content', r.desc);
        }
      })();
    </script>

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Carver" />
    <meta property="og:title" content="CARVER — Superyacht crew jobs, automated over WhatsApp" />
    <meta
      property="og:description"
      content="Text 'match' on WhatsApp. Carver scans every live superyacht role against your profile and applies on your behalf. No app. No inbox. Just the next berth."
    />
    <meta property="og:url" content="https://jobcarver.co/" />
    <!-- PNG, not SVG: WhatsApp and Facebook refuse to rasterise an SVG OG
         image and fall back to a bare text card. Absolute URL is required —
         scrapers do not resolve relative paths. -->
    <meta property="og:image" content="https://jobcarver.co/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Carver — Superyacht crew, automated" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CARVER — Superyacht crew jobs, automated over WhatsApp" />
    <meta
      name="twitter:description"
      content="Text 'match' on WhatsApp. Carver scans every live superyacht role and applies for you. No app, no forms."
    />
    <meta name="twitter:image" content="https://jobcarver.co/og-image.png" />
    <meta name="twitter:image:alt" content="Carver — Superyacht crew, automated" />

    <!-- Performance hints -->
    <!-- Warm up DNS+TLS to the API before the JS bundle asks for /auth/session. -->
    <link rel="preconnect" href="%VITE_API_BASE_URL%" crossorigin="use-credentials" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link
      rel="stylesheet"
      crossorigin="anonymous"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,100&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Caveat:wght@400;600&family=DM+Mono:wght@400;500&display=swap"
    />

    <!-- Structured data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Carver",
        "alternateName": "JobCarver",
        "url": "https://jobcarver.co/",
        "logo": "https://jobcarver.co/favicon.svg",
        "description": "Automated superyacht crew job matching and application over WhatsApp.",
        "sameAs": []
      }
    </script>

    <!-- Structured data: WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Carver",
        "url": "https://jobcarver.co/",
        "inLanguage": "en"
      }
    </script>

    <!-- Structured data: Service (the product itself) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Service",
        "serviceType": "Superyacht crew job matching",
        "provider": {
          "@type": "Organization",
          "name": "Carver",
          "url": "https://jobcarver.co/"
        },
        "areaServed": "Worldwide",
        "audience": {
          "@type": "Audience",
          "audienceType": "Superyacht crew, deckhands, stewardesses, chefs, engineers, captains"
        },
        "description": "Text 'match' on WhatsApp and Carver scans every live superyacht role against your crew profile, then applies on your behalf once you approve."
      }
    </script>
  </head>
  <body>
    <!-- ── Pre-JS shell ───────────────────────────────────────────────────
         Something real in the first paint. Until the bundle lands, a South
         African visitor on 3G used to stare at an empty black page; the
         headline and a working wa.me link now arrive with the HTML, so the
         page is usable (and convertible) before a single byte of JS runs.

         Styles are inline and the font stack is system-only so this never
         waits on the stylesheet or on Google Fonts. main.js removes the
         whole block the moment the app mounts.

         The number must match VITE_WHATSAPP_NUMBER / the fallback in
         src/config/site.js. The "· m-hero" suffix is the same source tag
         the mobile hero CTA uses — this shell is only on screen long enough
         to be tapped on a slow mobile connection. -->
    <div id="app-prelude">
      <style>
        #app-prelude {
          position: fixed;
          inset: 0;
          z-index: 1;
          display: flex;
          flex-direction: column;
          justify-content: center;
          gap: 1.1rem;
          padding: 1.5rem;
          background: #04070b;
          color: #f3ead8;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        #app-prelude .pl-brand {
          font-size: 12px;
          font-weight: 600;
          letter-spacing: 0.34em;
          color: #a8b3bf;
        }
        #app-prelude h1 {
          margin: 0;
          font-size: clamp(2.1rem, 9vw, 3.4rem);
          font-weight: 300;
          line-height: 1.04;
          letter-spacing: -0.025em;
        }
        #app-prelude .pl-mark { color: #e6c98c; font-style: italic; }
        #app-prelude p {
          margin: 0;
          max-width: 34rem;
          font-size: 15px;
          line-height: 1.6;
          color: #a8b3bf;
        }
        #app-prelude .pl-cta {
          align-self: flex-start;
          display: inline-flex;
          align-items: center;
          gap: 0.55rem;
          padding: 1rem 1.4rem;
          border-radius: 12px;
          background: #25d366;
          color: #04070b;
          font-size: 15px;
          font-weight: 700;
          text-decoration: none;
        }
        #app-prelude .pl-note {
          font-size: 12px;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          color: #8df0c4;
        }
        @media (min-width: 768px) {
          #app-prelude { padding: 4rem; gap: 1.4rem; }
        }
      </style>
      <p class="pl-brand">CARVER</p>
      <h1>Every live yacht job.<br />One text: <span class="pl-mark">&ldquo;match&rdquo;</span></h1>
      <p>
        Carver runs your whole superyacht job hunt inside WhatsApp — profile built in chat,
        every live role scanned on demand, application emails drafted for you.
      </p>
      <a
        class="pl-cta"
        href="https://wa.me/27688516141?text=Hi%20Carver%20%E2%80%94%20I'd%20like%20to%20start%20matching%20to%20yacht%20roles.%20%C2%B7%20m-hero"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 32 32" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M16 3C9.4 3 4 8.4 4 15c0 2.3.7 4.5 1.8 6.4L4 29l7.8-1.8A12 12 0 0 0 16 27c6.6 0 12-5.4 12-12S22.6 3 16 3Z"/></svg>
        Start free on WhatsApp
      </a>
      <p class="pl-note">5 free match runs &middot; no card</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
