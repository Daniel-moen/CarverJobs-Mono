[supervisord]
nodaemon=true

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true

[program:go-api]
command=/usr/local/bin/go-api
environment=PORT=8081,GIN_MODE=release
autostart=true
autorestart=true

[program:svelte]
command=pnpm run dev -- --host 0.0.0.0 --port 5173
directory=/app/frontend
autostart=true
autorestart=true
